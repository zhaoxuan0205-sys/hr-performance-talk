button, input, textarea { font: inherit; }

label { display: block; font-weight: 650; font-size: 14px; margin-bottom: 8px; }

}

/* ============================================================
   P0 应用层新增组件（登录、工作台、清单、设置）
   沿用原有配色变量与卡片语言
   ============================================================ */

.boot { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }

/* 登录页 */
.auth-wrap {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(360px, 420px);
  gap: clamp(24px, 5vw, 72px);
  align-items: center;
  padding: clamp(24px, 6vw, 80px);
  max-width: 1240px;
  margin-inline: auto;
}
.auth-side h1 { font-size: clamp(30px, 4vw, 46px); line-height: 1.2; margin: 22px 0 16px; letter-spacing: -0.02em; }
.auth-side .lead { max-width: 34em; }
.brand-plain { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.brand-plain small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 2px; }
.auth-points { margin: 26px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; line-height: 1.9; }
.auth-points li::marker { color: var(--navy); }
.auth-card { padding: clamp(22px, 3vw, 34px); }
.auth-tabs { display: flex; gap: 6px; background: #eef2f6; padding: 4px; border-radius: 10px; margin-bottom: 22px; }
.auth-tab { flex: 1; border: 0; background: transparent; padding: 9px 0; border-radius: 8px; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; }
.auth-tab.active { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(23,37,58,.1); }
.auth-card .field { margin-bottom: 16px; }
.auth-card .large-button { width: 100%; margin-top: 6px; }

/* 顶部导航 */
.nav-links { display: flex; gap: 4px; margin-left: 18px; }
.nav-link { border: 0; background: transparent; font: inherit; font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
.nav-link:hover { background: rgba(22,58,95,.06); color: var(--ink); }
.nav-link.active { color: var(--navy); font-weight: 600; background: rgba(22,58,95,.07); }
.user-chip { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.user-chip .link-button { font-size: 13px; }

/* 页头 */
.dash-head { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; margin: 26px 0 18px; flex-wrap: wrap; }
.dash-head h1 { font-size: clamp(22px, 2.6vw, 30px); margin: 6px 0 8px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dash-head .sub { color: var(--muted); font-size: 14px; margin: 0; }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumbs { margin-top: 18px; font-size: 13px; }

/* 统计 */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.stat span { font-size: 12.5px; color: var(--muted); }
.stat strong { font-size: 26px; letter-spacing: -0.02em; color: var(--navy); }

/* 列表 */
.list { display: flex; flex-direction: column; }
.list-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  width: 100%; text-align: left; font: inherit; color: inherit;
  padding: 15px 4px; border: 0; border-top: 1px solid var(--line);
  background: transparent; cursor: pointer;
}
.list-row:first-child { border-top: 0; }
.list-row:not(.static):hover { background: rgba(22,58,95,.035); }
.list-main { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.list-main strong { font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.list-main span { font-size: 12.5px; color: var(--muted); }
.list-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.arrow { color: var(--muted); font-size: 15px; }
.role-tag { font-size: 11.5px; font-weight: 500; color: var(--muted); background: #eef2f6; padding: 2px 8px; border-radius: 999px; }

.chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.chip-ready { color: var(--fact); background: var(--fact-bg); border-color: rgba(35,120,95,.18); }
.chip-draft { color: var(--muted); background: #f0f3f6; border-color: var(--line); }
.chip-risk { color: var(--risk); background: var(--risk-bg); border-color: rgba(165,61,70,.2); }

/* 空状态 */
.empty { text-align: center; padding: 42px 20px; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 8px; }
.empty p { margin: 0 auto; max-width: 30em; font-size: 13.5px; line-height: 1.8; }

/* 内联表单 */
.inline-form { margin-bottom: 16px; }
.inline-form .actions { margin-top: 12px; }
.rename-form { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
.rename-form input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 260px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* 链接按钮与危险操作 */
.link-button { border: 0; background: transparent; font: inherit; color: var(--navy); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.link-button.danger { color: var(--risk); }
.link-button.small-button { font-size: 12.5px; margin-left: 6px; }
a.secondary, a.primary { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.danger-button { border: 1px solid var(--risk); background: var(--risk); color: #fff; font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; cursor: pointer; }
.danger-button:hover { filter: brightness(1.06); }
.danger-zone { margin: 26px 0 60px; padding: 18px 20px; border: 1px dashed rgba(165,61,70,.35); border-radius: 12px; background: rgba(253,239,240,.5); }
.danger-zone strong { font-size: 14px; color: var(--risk); }
.danger-zone p { margin: 6px 0 10px; font-size: 13px; color: var(--muted); }
.danger-zone .actions { margin-top: 10px; }

/* 分析结果 */
.engine-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 24px 0 6px; }
.engine-bar .link-button { margin-left: auto; font-size: 12.5px; }
.warn-box { background: #fffdf5; border: 1px solid rgba(166,97,12,.25); border-radius: 10px; padding: 12px 16px 12px 16px; margin: 12px 0; }
.warn-box ul { margin: 0; padding-left: 18px; font-size: 13px; color: #7a4d09; line-height: 1.8; }
.risk-banner { background: var(--risk-bg); border: 1px solid rgba(165,61,70,.28); border-radius: 12px; padding: 16px 18px; margin: 14px 0; }
.risk-banner strong { color: var(--risk); font-size: 14px; }
.risk-banner p { margin: 6px 0 0; font-size: 13px; color: #7d2b32; line-height: 1.75; }
.risk-banner ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: #7d2b32; line-height: 1.8; }
.risk-banner.high { border-width: 2px; }
.opening { font-size: 15px; line-height: 1.85; color: var(--ink); margin: 8px 0 0; }
.alt { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.version-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 8px; font-size: 12.5px; color: var(--muted); }
.version-bar .choice { padding: 5px 10px; font-size: 12.5px; }

/* 键值表与清单 */
.kv { display: grid; gap: 10px; margin: 12px 0 0; }
.kv div { display: flex; gap: 16px; font-size: 13.5px; }
.kv dt { width: 96px; color: var(--muted); flex-shrink: 0; }
.kv dd { margin: 0; color: var(--ink); word-break: break-all; }
.plain-list { margin: 10px 0 0; padding-left: 18px; font-size: 13.5px; line-height: 1.9; color: var(--muted); }
select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); min-width: 140px; }

@media (max-width: 900px) {
  .auth-wrap { grid-template-columns: 1fr; padding: 28px 20px 48px; }
  .auth-side h1 { margin-top: 16px; }
  .stat-row { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .dash-head { flex-direction: column; }
  .head-actions { width: 100%; }
  .head-actions > * { flex: 1; }
  .list-row { flex-direction: column; align-items: flex-start; gap: 10px; }
  .list-meta { width: 100%; flex-wrap: wrap; }
  .nav-links { margin-left: 0; }
  .topbar { flex-wrap: wrap; gap: 10px; }
  .user-chip { margin-left: 0; }
}

      words: ["工伤", "事故", "受伤", "安全事件", "医疗", "病历", "抑郁症", "精神", "心理疾病", "住院", "病假"],
      advice: "涉及安全或健康信息。请避免在绩效材料中记录医疗细节，转 HR 按相关流程处理。",
    },
    {
      level: "high",
      label: "争议与投诉",
      words: ["劳动仲裁", "仲裁", "诉讼", "起诉", "举报", "投诉", "律师", "赔偿"],
      advice: "已进入或可能进入争议程序。请停止自行沟通，交由 HR/法务对接。",
    },
  ];

  var JUDGMENT_WORDS = [
    "责任心", "态度", "不积极", "不主动", "不靠谱", "能力不行", "能力差", "不胜任", "不适合",
    "敷衍", "不上心", "懒", "情商", "性格", "不专业", "消极", "抱怨", "抵触",
    "缺乏", "没有担当", "不配合", "耍滑", "混日子", "玻璃心", "固执", "自私", "不懂事", "眼界",
  ];

  var FACT_MARKERS = [
    /\d{1,4}\s*年/, /\d{1,2}\s*月/, /\d{1,2}\s*[日号]/, /[上下本]\s*周/, /周[一二三四五六日天]/,
    /\d{1,3}\s*(天|个工作日|小时|分钟|次|人|份|页|个)/, /\d+%/,
    /原定|原计划|计划|承诺|约定|要求|实际|最终|结果/,
    /推迟|延期|延迟|延误|提前|超期|逾期|未完成|没有完成|没交|未提交|迟到|缺席|超预算|返工|不达标/,
  ];

  var EXTERNAL_WORDS = ["设计", "客户", "供应商", "其他部门", "跨部门", "技术", "法务", "财务", "上级", "甲方", "需求变更", "排期", "资源", "预算"];
  var MECHANISM_WORDS = ["约定", "流程", "规则", "机制", "节点", "上报", "同步", "预警", "汇报", "周会", "日报", "复盘"];

  var ORDER = { high: 3, medium: 2, low: 1 };

  function clamp(text) {
    return String(text == null ? "" : text).slice(0, MAX_INPUT);
  }

  function splitClauses(text) {
    return String(text || "")
      .split(/[。！？；\n\r]+/)
      .map(function (item) {
        return item.replace(/^[，,、\s]+/, "").trim();
      })
      .filter(function (item) {
        return item.length >= 4;
      });
  }

  function stripHedges(clause) {
    return clause.replace(/^(我觉得|我认为|感觉|说实话|其实|反正|总的来说|说白了)[，,]?\s*/, "").trim();
  }

  function detectRisks(text) {
    var haystack = String(text || "").toLowerCase();
    var flags = [];
    RISK_GROUPS.forEach(function (group) {
      var hits = group.words.filter(function (word) {
        return haystack.indexOf(word.toLowerCase()) >= 0;
      });
      if (hits.length) {
        flags.push({ level: group.level, label: group.label, terms: hits, advice: group.advice });
      }
    });
    return flags;
  }

  function extractFacts(clauses) {
    var facts = [];
    clauses.forEach(function (clause) {
      var cleaned = stripHedges(clause);
      var isFact = FACT_MARKERS.some(function (pattern) {
        return pattern.test(cleaned);
      });
      if (!isFact) return;
      var exists = facts.some(function (item) {
        return item.text === cleaned;
      });
      if (exists) return;
      facts.push({ text: cleaned, source: "管理者口述" });
    });
    return facts.slice(0, 8);
  }

  function extractJudgments(clauses) {
    var judgments = [];
    clauses.forEach(function (clause) {
      var cleaned = stripHedges(clause);
      var hits = JUDGMENT_WORDS.filter(function (word) {
        return cleaned.indexOf(word) >= 0;
      });
      if (!hits.length) return;
      var exists = judgments.some(function (item) {
        return item.statement === cleaned;
      });
      if (exists) return;
      judgments.push({
        statement: cleaned,
        terms: hits,
        reason:
          "「" + hits.slice(0, 2).join("」「") + "」是在推断动机或性格。目前掌握的是行为与结果，动机需要当面问清楚，不宜作为面谈结论。",
        alternative: "可以改述成可观察的行为：在哪个时间点、没做什么动作、造成了什么可核实的结果。",
      });
    });
    return judgments.slice(0, 6);
  }

  function buildQuestions(payload) {
    var text = payload.text;
    var facts = payload.facts;
    var judgments = payload.judgments;
    var hasExternal = EXTERNAL_WORDS.some(function (word) { return text.indexOf(word) >= 0; });
    var hasMechanism = MECHANISM_WORDS.some(function (word) { return text.indexOf(word) >= 0; });
    var hasDelay = /延期|延迟|推迟|未完成|没有完成|没交|逾期|超期|不达标/.test(text);
    var questions = [];

    if (hasDelay) questions.push("你是什么时候第一次判断可能无法按期完成的？当时掌握的信息是什么？");
    if (hasExternal) {
      var deps = EXTERNAL_WORDS.filter(function (word) { return text.indexOf(word) >= 0; }).slice(0, 3);
      questions.push(deps.join("、") + "这边的情况，当时对你实际工作量的影响有多大？");
    }
    if (judgments.length) questions.push("当时你这么做，是基于哪些考虑？有没有我没看到的信息？");
    if (!hasMechanism) questions.push("我们之前有没有明确约定过：什么情况必须同步风险、在哪个节点同步？");
    if (facts.length < 2) questions.push("这件事的时间线能再帮我理一遍吗？我想把事实部分确认准确。");
    questions.push("如果重来一次，你希望自己在哪个节点做出不一样的判断？");

    var seen = {};
    return questions.filter(function (item) {
      if (seen[item]) return false;
      seen[item] = true;
      return true;
    }).slice(0, 5);
  }

  function buildResponsibilities(payload) {
    var text = payload.text;
    var items = [
      "核实这件事的目标与优先级，在事发当时是否清晰、是否与管理者的要求一致。",
      "检查自己是否提供过必要支持：资源、决策、优先级取舍。",
    ];
    var hasExternal = EXTERNAL_WORDS.some(function (word) { return text.indexOf(word) >= 0; });
    var hasMechanism = MECHANISM_WORDS.some(function (word) { return text.indexOf(word) >= 0; });
    if (hasExternal) items.push("核实跨部门或外部依赖的卡点，确认员工是否有权限推动这些依赖。");
    if (!hasMechanism) items.push("与员工共同建立风险预警路径：什么情况、找谁、多早说。");
    if (payload.judgments.length) items.push("面谈中先听完员工视角，再说明自己的观察，避免用评价性词语开场。");
    return items.slice(0, 5);
  }

  function buildActions(text) {
    var hasDelay = /延期|延迟|推迟|未完成|没有完成|逾期|不达标/.test(text);
    return [
      hasDelay
        ? "出现交付风险时，第一时间同步当前判断、影响范围和备选方案。"
        : "明确下一次同类任务的关键节点与检查方式。",
      "约定同步对象与时间：由谁、在哪个节点、用什么方式告知。",
      "约定复盘时间点，检查这次约定是否真的被执行。",
    ];
  }

  function buildOpening(role, facts) {
    var subject = role ? role + "相关的这件事" : "这件事";
    var anchor = facts.length ? "从时间线看，" + facts[0].text + "。" : "";
    return "我想和你过一下" + subject + "。" + anchor + "我这边看到的情况可能不完整，先听听你的版本。";
  }

  function analyze(input) {
    var role = (input && input.role) || "";
    var story = clamp(input && input.story);
    var goal = clamp(input && input.goal);
    var evidence = clamp(input && input.evidence);
    var text = [story, evidence].filter(Boolean).join("\n");

    var clauses = splitClauses(text);
    var riskFlags = detectRisks(story + "\n" + evidence + "\n" + goal);
    var facts = extractFacts(clauses);
    var judgments = extractJudgments(clauses);
    var questions = buildQuestions({ text: text, facts: facts, judgments: judgments });
    var level = "none";
    riskFlags.forEach(function (item) {
      if ((ORDER[item.level] || 0) > (ORDER[level] || 0)) level = item.level;
    });

    var warnings = [];
    if (!facts.length) warnings.push("没有从描述里提取到可核实的事实。建议补上：原本要求、实际发生、造成的影响、具体时间。");
    if (text.length < 30) warnings.push("描述偏短，提取结果可能不完整。");

    return {
      facts: facts,
      judgmentsToPause: judgments,
      questionsToVerify: questions,
      managerResponsibilities: buildResponsibilities({ text: text, judgments: judgments }),
      conversationOpening: buildOpening(role, facts),
      actionPlan: buildActions(text),
      riskFlags: riskFlags,
      riskLevel: level,
      warnings: warnings,
      engine: "rule-v1",
      generatedAt: new Date().toISOString(),
    };
  }

  return { analyze: analyze, detectRisks: detectRisks };
});

    <script>
"use strict";

/**
 * 谈绩效 · 单页应用（无登录、无注册、无服务端）
 * 数据存在本机浏览器的 localStorage，随时可导出 Markdown / JSON。
 */

var root = document.getElementById("app");
var STORE_KEY = "tanjixiao.v1";

var state = {
  view: "boot",
  data: null,
  draft: null,
  dirty: false,
  viewingVersion: null,
  showNewBatch: false,
  showNewCase: false,
  showNewCaseName: "",
  renaming: false,
  listening: false,
  summary: false,
  error: "",
  storageBroken: false,
};

/* ---------------- 存储 ---------------- */

function emptyData() {
  return { version: 1, batches: [], updatedAt: new Date().toISOString() };
}

function loadData() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return emptyData();
    var parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.batches)) return emptyData();
    return parsed;
  } catch (error) {
    state.storageBroken = true;
    return emptyData();
  }
}

function saveData() {
  if (!state.data) return;
  state.data.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state.data));
    state.storageBroken = false;
  } catch (error) {
    state.storageBroken = true;
    toast("浏览器存储空间不足或被禁用，改动可能无法保留。请立即导出。");
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ---------------- 工具 ---------------- */

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function relTime(iso) {
  if (!iso) return "";
  var diff = Date.now() - new Date(iso).getTime();
  if (diff < 60000) return "刚刚";
  if (diff < 3600000) return Math.floor(diff / 60000) + " 分钟前";
  if (diff < 86400000) return Math.floor(diff / 3600000) + " 小时前";
  if (diff < 7 * 86400000) return Math.floor(diff / 86400000) + " 天前";
  return new Date(iso).toLocaleDateString("zh-CN");
}

function toast(message) {
  var old = document.querySelector(".toast");
  if (old) old.remove();
  var node = document.createElement("div");
  node.className = "toast";
  node.setAttribute("role", "status");
  node.textContent = message;
  document.body.appendChild(node);
  setTimeout(function () {
    node.remove();
  }, 3200);
}

function findBatch(id) {
  return state.data.batches.filter(function (item) {
    return item.id === id;
  })[0];
}

function findCase(id) {
  var found = null;
  state.data.batches.forEach(function (batch) {
    batch.cases.forEach(function (item) {
      if (item.id === id) found = { batch: batch, item: item };
    });
  });
  return found;
}

function latestAnalysis(item) {
  return item.analyses && item.analyses.length ? item.analyses[item.analyses.length - 1] : null;
}

function batchStats(batch) {
  var ready = batch.cases.filter(function (item) {
    return latestAnalysis(item);
  }).length;
  var risk = batch.cases.filter(function (item) {
    var analysis = latestAnalysis(item);
    return analysis && analysis.riskLevel === "high";
  }).length;
  return { total: batch.cases.length, ready: ready, risk: risk };
}

/* ---------------- 视图：工作台 ---------------- */

function shell(content) {
  return (
    '<div class="shell">' +
    '<header class="topbar">' +
    '<button class="brand brand-button" data-act="goto" data-view="home" aria-label="返回工作台">' +
    '<span class="brand-mark">谈</span><span>谈绩效<small>面谈准备</small></span></button>' +
    '<nav class="nav-links">' +
    '<button class="nav-link" data-act="goto" data-view="home">工作台</button>' +
    '<button class="nav-link" data-act="goto" data-view="settings">设置</button>' +
    "</nav>" +

    "</header>" +

    "</main></div>"
  );
}

function homeView() {
  var batches = state.data.batches.slice().sort(function (a, b) {
    return new Date(b.updatedAt) - new Date(a.updatedAt);
  });
  var totalCases = 0;

  batches.forEach(function (batch) {
    var stats = batchStats(batch);

  var rows = batches.length
    ? batches
        .map(function (batch) {

            '<div class="list-meta">' +
            (stats.risk ? '<span class="chip chip-risk">' + stats.risk + " 人高风险</span>" : "") +

            '<span class="arrow">→</span></div></button>'

    : '<div class="empty"><strong>还没有准备任何批次</strong><p>一个批次对应一次绩效沟通周期，比如「2026 年度绩效反馈」。批次里逐人准备，谈完一起导出。</p>' +
      '<div class="empty-actions"><button class="secondary" data-act="load-sample">载入一个示例看看</button></div></div>';

  return shell(
    '<section class="dash-head"><div>' +
      '<div class="eyebrow">工作台</div><h1>谈前准备</h1>' +
      '<p class="sub">逐人准备，谈完一次导出所有人的沟通方案。不需要登录，数据存在这台设备的浏览器里。</p></div>' +
      '<button class="primary" data-act="toggle-new-batch">' + (state.showNewBatch ? "收起" : "＋ 新建批次") + "</button></section>" +

      (state.showNewBatch
        ? '<form class="panel slim-panel inline-form" data-form="create-batch">' +
          '<div class="form-grid">' +

          '<div class="field"><label for="batch-period">周期<span class="hint">可留空</span></label>' +
          '<input id="batch-period" name="periodLabel" placeholder="例如：2026 Q4" maxlength="120" /></div></div>' +
          '<div class="actions"><button class="secondary" type="button" data-act="toggle-new-batch">取消</button>' +
          '<button class="primary" type="submit">创建批次</button></div></form>'

      '<section class="stat-row">' +
      '<div class="stat"><span>批次</span><strong>' + batches.length + "</strong></div>" +

      '<section class="panel"><div class="panel-head simple-head">' +

      '<div class="list">' + rows + "</div></section>" +

      '<p class="local-note">数据只保存在这台设备的浏览器中。换设备或清理浏览器数据会丢失，建议每次谈完导出 Markdown 或 JSON 备份。' +
      '<button class="link-button" data-act="goto" data-view="settings">去导出</button></p>'

/* ---------------- 视图：批次 ---------------- */

function summaryMarkdown(batch) {

    } else {

    if (index < batch.cases.length - 1) {

    }
  });
  return lines.join("\n");
}

function batchView(batch) {

  return shell(

      (state.renaming

          '<button class="primary small-button" type="submit">保存</button>' +

        : "<h1>" + esc(batch.title) + ' <button class="link-button small-button" data-act="toggle-rename">改名</button></h1>') +
      "<p class=\"sub\">" + stats.total + " 人 · " + stats.ready + " 份方案</p></div>" +
      '<div class="head-actions">' +
      '<button class="primary" data-act="toggle-new-case">' + (state.showNewCase ? "收起" : "＋ 添加员工") + "</button>" +

      "</div></section>" +

      (stats.risk
        ? '<div class="risk-banner high"><strong>' + stats.risk + " 位员工触发了高风险提示</strong>" +
          "<p>涉及辞退、降薪、歧视骚扰、安全健康或争议情形时，本工具停止给出面谈话术。请先转 HR/法务，再决定是否继续沟通。</p></div>"

      (state.showNewCase

      '<section class="panel batch-guidance"><h3>整批沟通前共同检查</h3><ul>' +
      "<li>每个人都使用可核实的事实，不复制人格标签。</li>" +

function summaryView(batch) {
  return (
    '<section class="panel summary-panel" id="summary"><div class="panel-head simple-head">' +
    '<div><h2>本批方案汇总</h2><p class="sub">把所有人的方案并排放在一起看，逐人确认，不比较、不打分。</p></div></div>' +
    batch.cases
      .map(function (item) {
        var analysis = latestAnalysis(item);
        if (!analysis) {
          return '<article class="summary-card"><h3>' + esc(item.employeeName) + '</h3><p class="muted">尚未生成方案。</p></article>';
        }
        var bullets = function (items, pick) {
          if (!items || !items.length) return "";
          return "<ul>" + items.map(function (entry) { return "<li>" + esc(pick(entry)) + "</li>"; }).join("") + "</ul>";
        };
        return (
          '<article class="summary-card">' +
          "<h3>" + esc(item.employeeName) + (item.roleTitle ? '<small class="role-tag">' + esc(item.roleTitle) + "</small>" : "") +
          (analysis.riskLevel === "high" ? '<span class="chip chip-risk">高风险·转 HR</span>' : "") + "</h3>" +
          '<p class="muted">目标：' + esc(item.goal || "待补充") + "</p>" +
          (analysis.riskLevel === "high"
            ? '<div class="warn-box"><ul>' + analysis.riskFlags.map(function (risk) { return "<li>" + esc(risk.label) + "：" + esc(risk.advice) + "</li>"; }).join("") + "</ul></div>"
            : "") +
          '<div class="summary-block"><strong>先讲事实</strong>' + bullets(analysis.facts, function (entry) { return entry.text || entry; }) + "</div>" +
          '<div class="summary-block"><strong>要问清</strong>' + bullets(analysis.questionsToVerify, function (entry) { return entry; }) + "</div>" +
          (analysis.riskLevel === "high" ? "" : '<div class="summary-block"><strong>要约定</strong>' + bullets(analysis.actionPlan, function (entry) { return entry; }) + "</div>") +
          '<button class="link-button" data-act="open-case" data-id="' + esc(item.id) + '">打开完整方案 →</button>' +
          "</article>"
        );
      })
      .join("") +
    "</section>"
  );
}

/* ---------------- 视图：个案 ---------------- */

function analysisView(analysis) {
  if (!analysis) return "";
  var high = analysis.riskLevel === "high";
  var section = function (title, items, pick) {
    if (!items || !items.length) return "";
    return '<section class="analysis-card"><h3>' + title + "</h3><ul>" + items.map(pick).join("") + "</ul></section>";
  };
  // 高风险：只保留事实、判断提醒与核实问题；开场与行动约定属于"话术"，一律不给
  return (
    '<div class="engine-bar">' +
    '<span class="status ' + (high ? "" : "usable") + '">' + (high ? "已停止自动建议" : "规则分析 · 本地运行") + "</span>" +
    "<span>v" + analysis.versionNo + " · " + relTime(analysis.generatedAt) + "</span>" +
    '<button class="link-button" data-act="copy-plan">复制这一份</button></div>' +
    (analysis.warnings && analysis.warnings.length
      ? '<div class="warn-box"><ul>' + analysis.warnings.map(function (item) { return "<li>" + esc(item) + "</li>"; }).join("") + "</ul></div>"
      : "") +
    (analysis.riskFlags && analysis.riskFlags.length
      ? '<div class="risk-banner ' + (high ? "high" : "") + '"><strong>' + (high ? "已停止自动建议" : "风险提示") + "</strong><ul>" +
        analysis.riskFlags.map(function (risk) {
          return "<li><b>" + esc(risk.label) + "</b>（" + esc(risk.level) + "）：" + esc(risk.advice) + "</li>";
        }).join("") + "</ul></div>"
      : "") +
    (high
      ? '<div class="warn-box"><ul><li>由于涉及高风险情形，开场话术与行动约定已隐藏。请先与 HR/法务确认处理方式，再决定是否继续绩效沟通。</li></ul></div>'
      : analysis.conversationOpening
        ? '<section class="analysis-card"><h3>开场怎么说</h3><p class="opening">' + esc(analysis.conversationOpening) + "</p></section>"

    section("可以直接陈述的事实", analysis.facts, function (entry) {

      return "<li>" + esc(entry) + "</li>";

  );
}

          '<button class="danger-button" data-act="clear-all">确认清空</button></div>'
        : '<button class="link-button danger" data-act="ask-clear">清空数据</button>') +

/* ---------------- 渲染 ---------------- */

function parseHash() {
  var raw = location.hash.replace(/^#\/?/, "");
  var parts = raw.split("/");
  return { view: parts[0] || "home", id: parts[1] || "" };
}

function setHash(hash, push) {
  if (location.hash === hash) return;
  if (push) history.pushState({}, "", hash);
  else history.replaceState({}, "", hash);
}

function render() {
  var route = parseHash();
  if (route.view === "batch" && route.id) {
    var batch = findBatch(route.id);
    if (batch) {
      root.innerHTML = batchView(batch);
      return;
    }
  }
  if (route.view === "case" && route.id) {
    var found = findCase(route.id);
    if (found) {
      root.innerHTML = caseView(found.batch, found.item);
      return;
    }
  }
  if (route.view === "settings") {
    root.innerHTML = settingsView();
    return;
  }
  root.innerHTML = homeView();
}

function go(view, id) {
  state.viewingVersion = null;
  state.renaming = false;
  state.showNewCase = false;
  state.showNewBatch = false;
  state.summary = false;
  if (view === "home") setHash("#/home", true);
  else if (view === "settings") setHash("#/settings", true);
  else setHash("#/" + view + "/" + id, true);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------------- 语音 ---------------- */

var recognition = null;

function toggleVoice() {
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return;
  if (state.listening && recognition) {
    recognition.stop();
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = "zh-CN";
  recognition.continuous = true;
  recognition.interimResults = true;
  var before = state.draft.story.trim();
  recognition.onstart = function () {
    state.listening = true;
    render();
  };
  recognition.onresult = function (event) {
    var text = "";
    for (var index = event.resultIndex; index < event.results.length; index += 1) {
      text += event.results[index][0].transcript;
    }
    state.draft.story = before + (before ? "\n" : "") + text;
    var field = root.querySelector("#story");
    if (field) field.value = state.draft.story;
    scheduleSave();
  };
  recognition.onerror = function (event) {
    state.listening = false;
    render();
    toast(event.error === "not-allowed" ? "未获得麦克风权限，可以继续用文字输入。" : "语音识别不可用，请改用文字。");
  };
  recognition.onend = function () {
    state.listening = false;
    render();
  };
  recognition.start();
}

/* ---------------- 保存 ---------------- */

var saveTimer = null;

function scheduleSave() {
  state.dirty = true;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    commitDraft(true);
  }, 500);
}

function commitDraft(silent) {
  var route = parseHash();
  if (route.view !== "case" || !route.id) return;
  var found = findCase(route.id);
  if (!found) return;
  if (state.draft.employeeName.trim()) found.item.employeeName = state.draft.employeeName.trim();
  found.item.roleTitle = state.draft.roleTitle.trim();
  found.item.story = state.draft.story;
  found.item.goal = state.draft.goal;
  found.item.evidence = state.draft.evidence;
  found.item.updatedAt = new Date().toISOString();
  found.batch.updatedAt = new Date().toISOString();
  saveData();
  state.dirty = false;
  if (!silent) toast("已保存");
}

function download(filename, content, mime) {
  var blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function () {
    URL.revokeObjectURL(url);
  }, 1000);
}

function copyText(text, okMessage) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function () {
        toast(okMessage);
      },
      function () {
        toast("浏览器未允许复制，请改用导出。");
      }
    );
  } else {
    toast("当前浏览器不支持一键复制，请改用导出。");
  }
}

/* ---------------- 事件 ---------------- */

root.addEventListener("click", function (event) {
  var target = event.target.closest("[data-act]");
  if (!target) return;
  var act = target.dataset.act;
  var route = parseHash();

  if (act === "goto") {
    go(target.dataset.view);
    return;
  }
  if (act === "toggle-new-batch") {
    state.showNewBatch = !state.showNewBatch;
    render();
    return;
  }
  if (act === "toggle-new-case") {
    state.showNewCase = !state.showNewCase;
    render();
    if (state.showNewCase) {
      var input = root.querySelector("#emp-name");
      if (input) input.focus();
    }
    return;
  }
  if (act === "toggle-summary") {
    state.summary = !state.summary;
    render();
    var node = root.querySelector("#summary");
    if (node) node.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (act === "toggle-rename") {
    state.renaming = !state.renaming;
    render();
    return;
  }
  if (act === "open-batch") {
    go("batch", target.dataset.id);
    return;
  }
  if (act === "open-case") {
    var found = findCase(target.dataset.id);
    if (!found) return;
    state.draft = {
      employeeName: found.item.employeeName,
      roleTitle: found.item.roleTitle || "",
      story: found.item.story || "",
      goal: found.item.goal || "",
      evidence: found.item.evidence || "",
    };
    state.dirty = false;
    go("case", found.item.id);
    return;
  }
  if (act === "open-summary") {
    var batchId = target.dataset.id || (findCase(route.id) || {}).batch;
    go("batch", typeof batchId === "string" ? batchId : route.id);
    state.summary = true;
    render();
    var summary = root.querySelector("#summary");
    if (summary) summary.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (act === "voice") {
    toggleVoice();
    return;
  }
  if (act === "scroll-analysis") {
    var analysisNode = root.querySelector("#analysis");
    if (analysisNode) analysisNode.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (act === "view-version") {
    state.viewingVersion = Number(target.dataset.no);
    render();
    var versionNode = root.querySelector("#analysis");
    if (versionNode) versionNode.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (act === "analyze") {
    var current = findCase(route.id);
    if (!current) return;
    if (!state.draft.employeeName.trim()) {
      toast("先填上员工姓名或代号。");
      return;
    }
    if (state.draft.story.trim().length < 15 && !state.draft.evidence.trim()) {
      toast("情况描述太短，至少写清发生了什么。");
      return;
    }
    commitDraft(true);
    var result = window.TanJixiaoAnalysis.analyze({
      role: state.draft.roleTitle || state.draft.employeeName,
      story: state.draft.story,
      goal: state.draft.goal,
      evidence: state.draft.evidence,
    });
    result.versionNo = current.item.analyses.length + 1;
    current.item.analyses.push(result);
    current.item.updatedAt = new Date().toISOString();
    current.batch.updatedAt = new Date().toISOString();
    saveData();
    state.viewingVersion = null;
    render();
    toast(result.riskLevel === "high" ? "已识别高风险，停止给出话术" : "方案已生成");
    var target2 = root.querySelector("#analysis");
    if (target2) target2.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (act === "copy-plan") {
    var found2 = findCase(route.id);
    if (!found2) return;
    var item2 = found2.item;
    var analysis2 = state.viewingVersion != null
      ? item2.analyses.filter(function (entry) { return entry.versionNo === state.viewingVersion; })[0]
      : latestAnalysis(item2);
    var text = ["# " + item2.employeeName + " 面谈准备（v" + analysis2.versionNo + "）", ""];
    if (analysis2.riskLevel !== "high" && analysis2.conversationOpening) text.push("## 开场", analysis2.conversationOpening, "");
    var push = function (title, items, pick) {
      if (!items || !items.length) return;
      text.push("## " + title);
      items.forEach(function (entry) { text.push("- " + pick(entry)); });
      text.push("");
    };
    push("可以直接陈述的事实", analysis2.facts, function (entry) { return entry.text || entry; });
    push("先不要下的结论", analysis2.judgmentsToPause, function (entry) { return entry.statement + " —— " + entry.reason; });
    push("面谈中需要问清", analysis2.questionsToVerify, function (entry) { return entry; });
    push("管理者也要承担的部分", analysis2.managerResponsibilities, function (entry) { return entry; });
    if (analysis2.riskLevel !== "high") push("谈完要约定", analysis2.actionPlan, function (entry) { return entry; });
    if (analysis2.riskLevel === "high") text.push("## 风险提示", "> 已停止自动建议：请先与 HR/法务确认处理方式。");
    text.push("> 本文是谈前准备，不是绩效结论。");
    copyText(text.join("\n"), "已复制到剪贴板");
    return;
  }
  if (act === "next-person") {
    var currentBatch = (findCase(route.id) || {}).batch;
    commitDraft(true);
    if (currentBatch) {
      go("batch", currentBatch.id);
      state.showNewCase = true;
      render();
      var nameField = root.querySelector("#emp-name");
      if (nameField) nameField.focus();
      toast("已保存，接着录下一位");
    }
    return;
  }
  if (act === "export-batch" || act === "copy-batch") {
    var batch = findBatch(route.id);
    if (!batch) return;
    var markdown = summaryMarkdown(batch);
    if (act === "export-batch") {
      download("面谈方案-" + batch.title + "-" + new Date().toISOString().slice(0, 10) + ".md", markdown, "text/markdown;charset=utf-8");
      toast("已导出 Markdown");
    } else {
      copyText(markdown, "已复制汇总");
    }
    return;
  }
  if (act === "delete-case") {
    var name = target.dataset.name || "该员工";
    if (!window.confirm("确认删除「" + name + "」的个案和全部分析版本？此操作无法恢复。")) return;
    var located = findCase(target.dataset.id);
    if (!located) return;
    located.batch.cases = located.batch.cases.filter(function (entry) {
      return entry.id !== target.dataset.id;
    });
    located.batch.updatedAt = new Date().toISOString();
    saveData();
    if (route.view === "case") go("batch", located.batch.id);
    else render();
    toast("已删除");
    return;
  }
  if (act === "delete-batch") {
    var batchToDelete = findBatch(target.dataset.id);
    if (!batchToDelete) return;
    if (!window.confirm("确认删除批次「" + batchToDelete.title + "」及其中全部个案？此操作无法恢复。")) return;
    state.data.batches = state.data.batches.filter(function (entry) {
      return entry.id !== target.dataset.id;
    });
    saveData();
    go("home");
    toast("批次已删除");
    return;
  }
  if (act === "export-all") {
    download("谈绩效-备份-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(state.data, null, 2), "application/json");
    toast("已导出 JSON 备份");
    return;
  }
  if (act === "ask-clear") {
    state.confirmClear = true;
    render();
    return;
  }
  if (act === "cancel-clear") {
    state.confirmClear = false;
    render();
    return;
  }
  if (act === "clear-all") {
    state.data = emptyData();
    saveData();
    state.confirmClear = false;
    go("home");
    toast("本机数据已清空");
    return;
  }
  if (act === "load-sample") {
    loadSample();
    return;
  }
});

root.addEventListener("input", function (event) {
  var field = event.target;
  if (!field.name) return;
  if (state.draft && field.name in state.draft) {
    state.draft[field.name] = field.value;
    scheduleSave();
  }
});

root.addEventListener("change", function (event) {
  if (event.target.dataset.role === "import") {
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        if (!parsed || !Array.isArray(parsed.batches)) throw new Error("格式不对");
        if (!window.confirm("导入会覆盖当前浏览器里的全部数据，确认继续？")) return;
        state.data = parsed;
        saveData();
        go("home");
        toast("已导入");
      } catch (error) {
        toast("导入失败：文件不是有效的备份 JSON。");
      }
    };
    reader.readAsText(file);
    event.target.value = "";
  }
});

root.addEventListener("submit", function (event) {
  var form = event.target.closest("form[data-form]");
  if (!form) return;
  event.preventDefault();
  var data = new FormData(form);
  var kind = form.dataset.form;

  if (kind === "create-batch") {
    var title = String(data.get("title") || "").trim();
    if (!title) return;
    var batch = {
      id: uid(),
      title: title,
      periodLabel: String(data.get("periodLabel") || "").trim(),
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      cases: [],
    };
    state.data.batches.push(batch);
    saveData();
    state.showNewBatch = false;
    go("batch", batch.id);
    return;
  }

  if (kind === "rename-batch") {
    var current = findBatch(parseHash().id);
    var newTitle = String(data.get("title") || "").trim();
    if (current && newTitle) {
      current.title = newTitle;
      current.updatedAt = new Date().toISOString();
      saveData();
    }
    state.renaming = false;
    render();
    return;
  }

  if (kind === "create-case") {
    var batchId = parseHash().id;
    var target = findBatch(batchId);
    if (!target) return;
    var name = String(data.get("employeeName") || "").trim();
    if (!name) return;
    var item = {
      id: uid(),
      employeeName: name,
      roleTitle: String(data.get("roleTitle") || "").trim(),
      story: "",
      goal: "",
      evidence: "",
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      analyses: [],
    };
    target.cases.push(item);
    target.updatedAt = new Date().toISOString();
    saveData();
    state.draft = { employeeName: item.employeeName, roleTitle: item.roleTitle, story: "", goal: "", evidence: "" };
    state.dirty = false;
    go("case", item.id);
    return;
  }

  if (kind === "save-case") {
    commitDraft(false);
    render();
    return;
  }
});

window.addEventListener("popstate", function () {
  render();
});

window.addEventListener("beforeunload", function (event) {
  if (state.dirty) {
    commitDraft(true);
  }
});

/* ---------------- 示例 ---------------- */

function loadSample() {
  var existing = state.data.batches.filter(function (item) {
    return item.title === "示例：2026 年度绩效反馈";
  })[0];
  var batch = existing;
  if (!batch) {
    batch = {
      id: uid(),
      title: "示例：2026 年度绩效反馈",
      periodLabel: "2026 Q4",
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      cases: [],
    };
    state.data.batches.push(batch);
  }
  if (!batch.cases.length) {
    var story =
      "产品经理负责的客户方案原定 10 月 16 日提交，实际 10 月 18 日才提交。他在 10 月 15 日已经发现可能延期，但没有告诉我或客户经理。客户评审因此推迟两天。设计素材也比计划晚了一天。我觉得他缺乏责任心。";
    var item = {
      id: uid(),
      employeeName: "产品-A",
      roleTitle: "产品经理",
      story: story,
      goal: "弄清没有提前预警的原因，并约定以后发现交付风险时的沟通机制。",
      evidence: "",
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      analyses: [],
    };
    var result = window.TanJixiaoAnalysis.analyze({ role: item.roleTitle, story: story, goal: item.goal, evidence: "" });
    result.versionNo = 1;
    item.analyses.push(result);
    batch.cases.push(item);
  }
  saveData();
  go("batch", batch.id);
  toast("示例已载入，可以直接改文字试试");
}

/* ---------------- 启动 ---------------- */

state.data = loadData();
render();
if (!location.hash) setHash("#/home", false);

</script>
